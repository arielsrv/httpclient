# yaml-language-server: $schema=https://json.schemastore.org/taskfile.json
version: '3'

env:
  CGO_ENABLED: 0

tasks:
  lint-tools:
    cmds:
      - go tool golangci-lint run --fix
      - go tool gofumpt -w -l .
      - go tool betteralign -test_files -generated_files -apply ./...

  lint:
    cmds:
      - cd examples
      - task: lint-tools
      - cd ..
      - task: lint-tools
  test:nil:
    cmds:
      - go tool nilaway ./...
  # -short skips the container-backed cache tests: repeating them five times only
  # pays for Docker startup, the races worth catching are in the client itself.
  test:race:
    cmds:
      - go test -race -short -count 5 ./... -v
  # Cache backends against real Redis and Memcached, via testcontainers.
  # Needs a running Docker daemon; the tests skip themselves when there is none.
  test:integration:
    cmds:
      - go test -count 1 -run 'Redis|Memcached' ./... -v
  test:mock:
    cmds:
      - go tool mockery --config .mockery.yml
  test:
    cmds:
      - task: test:mock
      - go test -v ./...
      - task: test:race
  download:
    cmds:
      - go work sync
      - (cd examples || exit ; go mod tidy)
      - (cd examples || exit ; go build ./...)
      - go mod tidy
  upgrade:
    cmds:
      - go mod tidy
      - (cd examples || exit ; go mod tidy)
      - go tool go-mod-upgrade
  default:
    cmds:
      - task: download
      - task: lint
      - task: test