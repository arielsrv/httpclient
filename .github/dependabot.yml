# Dependabot configuration.
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Go module updates are paused: the updater runs in Dependabot's own image
  # with its own Go toolchain, which cannot be pinned from here, and it fails on
  # the `go 1.27` directive in go.mod while 1.27 is unreleased. Re-enable this
  # block once Go 1.27 ships. Until then, `task upgrade` (go-mod-upgrade) does
  # the same job locally.
  # - package-ecosystem: gomod
  #   directory: /
  #   schedule:
  #     interval: weekly
  #   groups:
  #     go-modules:
  #       patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]