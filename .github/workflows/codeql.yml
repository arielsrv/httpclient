# CodeQL analysis. The Go job needs a toolchain that understands the `go 1.27`
# directive in go.mod (generic methods), which the runner does not ship yet, so
# setup-go installs the pinned one before the CodeQL extractor runs.
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '35 18 * * 0'

env:
  # Keep in sync with ci.yml. Switch to '1.27.x' once Go 1.27 ships.
  GO_VERSION: '1.27.0-rc.2'
  # The pinned toolchain already satisfies go.mod; never try to fetch another
  # one, which would fail while 1.27 is unreleased.
  GOTOOLCHAIN: local

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        # Manual rather than autobuild: autobuild would run before we can be
        # sure which toolchain it picks up.
        - language: go
          build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Must come before init: the Go extractor uses whatever `go` is on PATH.
    - name: Set up Go
      if: matrix.language == 'go'
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    - name: Build
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        go build ./...
        (cd examples && go build ./...)

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"